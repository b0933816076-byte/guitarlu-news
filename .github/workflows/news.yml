name: 吉他新聞每日更新
on:
  schedule:
    - cron: '10 22 * * *'   # 台灣 06:10
    - cron: '40 7 * * *'    # 台灣 15:40(Gemini 免費額度約 15:00 重置後)
    - cron: '10 10 * * *'   # 台灣 18:10(第二次,早上漏掉也會補)
  workflow_dispatch:
permissions:
  contents: write
concurrency: news
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests feedparser trafilatura opencc-python-reimplemented
      - name: 抓新聞＋Gemini 免費 AI 寫摘要＋多關審稿
        id: main
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
        run: |
          set +e
          python news.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 存檔
        run: |
          git config user.name "guitarlu-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "吉他新聞 $(date -u +%F' '%H:%M)" || echo "沒有變動"
          git push
